<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Jorge Alberto San Martín Hernández — Backend, Automatización, Cloud" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#14122a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8E75D0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8E75D0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#faf9ff"/>
      <stop offset="0.6" stop-color="#d9d3f5"/>
      <stop offset="1" stop-color="#a89ddb"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="canvas"><rect width="1000" height="260" rx="16"/></clipPath>

    <!-- fases: un disco oscuro cruza la luna -->
    <mask id="phase" maskUnits="userSpaceOnUse" x="700" y="40" width="240" height="180">
      <rect x="700" y="40" width="240" height="180" fill="#fff"/>
      <circle cx="925" cy="130" r="44" fill="#000">
        <animate attributeName="cx" values="925;820;715;820;925" keyTimes="0;0.25;0.5;0.75;1"
                 calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"
                 dur="20s" repeatCount="indefinite"/>
      </circle>
    </mask>
  </defs>

  <g clip-path="url(#canvas)">
    <rect width="1000" height="260" fill="url(#bg)"/>

    <!-- estrellas -->
    <g fill="#fff">
      <circle cx="60"  cy="40"  r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s"   repeatCount="indefinite"/></circle>
      <circle cx="130" cy="225" r="1.0"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="5s"   repeatCount="indefinite"/></circle>
      <circle cx="300" cy="22"  r="1.0"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="6s"   repeatCount="indefinite"/></circle>
      <circle cx="430" cy="232" r="1.3"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="48"  r="1.1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.8s" repeatCount="indefinite"/></circle>
      <circle cx="620" cy="36"  r="1.5"><animate attributeName="opacity" values="0.3;1;0.3"   dur="5.4s" repeatCount="indefinite"/></circle>
      <circle cx="660" cy="170" r="1.0"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="705" cy="82"  r="1.1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="745" cy="218" r="1.2"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="5.6s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="28"  r="1.0"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="6.2s" repeatCount="indefinite"/></circle>
      <circle cx="905" cy="48"  r="1.4"><animate attributeName="opacity" values="0.2;1;0.2"   dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="935" cy="105" r="1.0"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="950" cy="190" r="1.2"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="5.2s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="228" r="1.0"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="4.6s" repeatCount="indefinite"/></circle>
      <circle cx="982" cy="70"  r="1.1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="6s"   repeatCount="indefinite"/></circle>
    </g>

    <!-- estrella fugaz -->
    <g opacity="0">
      <line x1="-46" y1="-14" x2="0" y2="0" stroke="url(#trail)" stroke-width="1.6" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="translate" values="500 22;720 88;720 88" keyTimes="0;0.08;1" dur="11s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.07;0.08;1" dur="11s" begin="3s" repeatCount="indefinite"/>
    </g>

    <!-- luna -->
    <g>
      <circle cx="820" cy="130" r="110" fill="url(#halo)"/>
      <circle cx="820" cy="130" r="44" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.14"/>
      <g mask="url(#phase)">
        <circle cx="820" cy="130" r="44" fill="url(#moon)"/>
        <g fill="#8a80c0" fill-opacity="0.35">
          <circle cx="805" cy="116" r="7"/>
          <circle cx="834" cy="146" r="10"/>
          <circle cx="822" cy="102" r="4"/>
          <circle cx="842" cy="120" r="5"/>
          <circle cx="803" cy="148" r="3.5"/>
        </g>
      </g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="8s" repeatCount="indefinite"/>
    </g>

    <!-- texto -->
    <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
      <text x="70" y="122" font-size="34" font-weight="600" fill="#f0f6fc" textLength="610" lengthAdjust="spacingAndGlyphs">Jorge Alberto San Martín Hernández</text>
      <text x="71" y="156" font-size="17" letter-spacing="0.8" fill="#8b949e">Backend  ·  Automatización  ·  Cloud</text>
      <rect x="71" y="176" width="40" height="2" rx="1" fill="#8E75D0"/>
    </g>
  </g>
</svg>
