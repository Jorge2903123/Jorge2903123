<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Jorge San Martin Hernández — Backend, Automatización, Cloud" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0b12"/>
      <stop offset="1" stop-color="#11131f"/>
    </linearGradient>

    <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4c8ff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sphere" cx="0.3" cy="0.25" r="0.85">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#8E75D0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8E75D0" stop-opacity="0.02"/>
    </radialGradient>

    <filter id="blurBack" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="blurFrost" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>

    <clipPath id="card">
      <rect x="90" y="54" width="820" height="176" rx="30"/>
    </clipPath>

    <g id="orbs">
      <g>
        <circle cx="220" cy="130" r="115" fill="#8E75D0"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 40 -18; 0 0" dur="16s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="540" cy="250" r="100" fill="#4F6BED"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; -35 -25; 0 0" dur="19s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="810" cy="80" r="120" fill="#C86DD7" fill-opacity="0.85"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; -45 30; 0 0" dur="22s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="660" cy="40" r="55" fill="#5EEAD4" fill-opacity="0.5"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 25 20; 0 0" dur="13s" repeatCount="indefinite"/>
      </g>
    </g>
  </defs>

  <!-- fondo -->
  <rect width="1000" height="280" rx="24" fill="url(#bg)"/>
  <g clip-path="inset(0 round 24px)">
    <use href="#orbs" xlink:href="#orbs" filter="url(#blurBack)"/>
  </g>

  <!-- capa trasera (profundidad) -->
  <rect x="124" y="36" width="752" height="176" rx="30" fill="#fff" fill-opacity="0.035" stroke="#fff" stroke-opacity="0.1"/>

  <!-- tarjeta principal de vidrio -->
  <g filter="url(#shadow)">
    <rect x="90" y="54" width="820" height="176" rx="30" fill="#0b0d16" fill-opacity="0.35"/>
  </g>
  <g clip-path="url(#card)">
    <g opacity="0.6">
      <use href="#orbs" xlink:href="#orbs" filter="url(#blurFrost)"/>
    </g>
    <rect x="90" y="54" width="820" height="176" fill="url(#glassFill)"/>
    <rect x="130" y="54.5" width="740" height="1.2" fill="url(#edge)"/>
  </g>
  <rect x="90.6" y="54.6" width="818.8" height="174.8" rx="29.4" fill="none" stroke="url(#glassStroke)" stroke-width="1.2"/>

  <!-- esferas de cristal -->
  <g>
    <circle cx="770" cy="142" r="56" fill="url(#sphere)" stroke="#fff" stroke-opacity="0.28" stroke-width="1"/>
    <ellipse cx="752" cy="118" rx="22" ry="10" fill="#fff" fill-opacity="0.18" transform="rotate(-28 752 118)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="7s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle cx="852" cy="96" r="22" fill="url(#sphere)" stroke="#fff" stroke-opacity="0.28" stroke-width="1"/>
    <ellipse cx="845" cy="87" rx="8" ry="4" fill="#fff" fill-opacity="0.22" transform="rotate(-28 845 87)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 7; 0 0" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- texto -->
  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="140" y="126" font-size="52" font-weight="600" letter-spacing="-1.5" fill="url(#title)">Jorge San Martín</text>
    <text x="142" y="158" font-size="19" font-weight="400" letter-spacing="0.6" fill="#fff" fill-opacity="0.62">Backend  ·  Automatización  ·  Cloud</text>

    <rect x="141" y="178" width="430" height="32" rx="16" fill="#fff" fill-opacity="0.07" stroke="#fff" stroke-opacity="0.2"/>
    <circle cx="161" cy="194" r="4" fill="#5EEAD4">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="177" y="199" font-size="14" fill="#fff" fill-opacity="0.78">Construyendo un SaaS multi-tenant con IA y WhatsApp</text>
  </g>
</svg>
